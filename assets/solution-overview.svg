<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="662" viewBox="0 0 1200 662" role="img" aria-labelledby="title desc">
<title id="title">LLM-Rec · 从输出头训练到单模型推理</title><desc id="desc">离线阶段得到输出头差分；部署时只加载合成后的一个模型。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7c"/></marker></defs>
<rect width="1200" height="662" rx="18" fill="#f7fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">
<text x="38" y="52" font-size="29" fill="#19334a" font-weight="700" text-anchor="start">LLM-Rec · 从输出头训练到单模型推理</text>
<text x="38" y="84" font-size="16" fill="#536b7c" font-weight="400" text-anchor="start">离线阶段得到输出头差分；部署时只加载合成后的一个模型。</text>
<rect x="32" y="112" width="356" height="440" rx="12" fill="#fff" stroke="#cedce5"/>
<text x="52" y="149" font-size="19" fill="#536b7c" font-weight="400" text-anchor="start">01</text>
<text x="97" y="149" font-size="24" fill="#19334a" font-weight="700" text-anchor="start">输出头训练</text>
<rect x="422" y="112" width="356" height="440" rx="12" fill="#fff" stroke="#cedce5"/>
<text x="442" y="149" font-size="19" fill="#536b7c" font-weight="400" text-anchor="start">02</text>
<text x="487" y="149" font-size="24" fill="#19334a" font-weight="700" text-anchor="start">选择性合成</text>
<rect x="812" y="112" width="356" height="440" rx="12" fill="#fff" stroke="#cedce5"/>
<text x="832" y="149" font-size="19" fill="#536b7c" font-weight="400" text-anchor="start">03</text>
<text x="877" y="149" font-size="24" fill="#19334a" font-weight="700" text-anchor="start">最终推理</text>
<rect x="52" y="177" width="316" height="103" rx="12" fill="#fff" stroke="#cedce5"/>
<text x="72" y="211" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Ancestor</text>
<text x="72" y="244" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">aligned-replay 模型</text>
<text x="72" y="271" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Transformer 主干冻结</text>
<path d="M210,280 L210,315" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="320" width="316" height="103" rx="12" fill="#eaf4fb" stroke="#cedce5"/>
<text x="72" y="354" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Expert</text>
<text x="72" y="387" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">R0 replay · 训练 10 步</text>
<text x="72" y="414" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">仅更新 lm_head</text>
<text x="72" y="470" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">得到 ΔW = Wexpert − Wancestor</text>
<text x="72" y="505" font-size="17" fill="#536b7c" font-weight="400" text-anchor="start">训练阶段正常最小化损失</text>
<rect x="442" y="177" width="316" height="103" rx="12" fill="#fff" stroke="#cedce5"/>
<text x="462" y="211" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Target</text>
<text x="462" y="244" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">最终模型主体</text>
<text x="462" y="271" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">EXP-174</text>
<path d="M600,280 L600,315" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="442" y="320" width="316" height="103" rx="12" fill="#fff5e5" stroke="#cedce5"/>
<text x="462" y="354" font-size="22" fill="#bd862e" font-weight="700" text-anchor="start">SID a / b / c 行</text>
<text x="462" y="387" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Wtarget − 0.5 × ΔW</text>
<text x="462" y="414" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">其余参数取自 Target</text>
<text x="462" y="470" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">差分计算：FP32</text>
<text x="462" y="505" font-size="17" fill="#536b7c" font-weight="400" text-anchor="start">写回：Target 参数类型</text>
<rect x="832" y="177" width="316" height="103" rx="12" fill="#fff" stroke="#cedce5"/>
<text x="852" y="211" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">任务输入</text>
<text x="852" y="244" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">物料描述 / 用户历史</text>
<text x="852" y="271" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">或用户理解与知识问答指令</text>
<path d="M990,280 L990,315" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)"/>
