<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="662" viewBox="0 0 1200 662" role="img" aria-labelledby="title desc">
<title id="title">LLM-Rec · Head training to single-model inference</title><desc id="desc">Compute the head update offline; deploy one composed model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7c" /></marker></defs>
<rect width="1200" height="662" rx="18" fill="#f7fafc" />
<g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">
<text x="38" y="52" font-size="29" fill="#19334a" font-weight="700" text-anchor="start">LLM-Rec · Head training to single-model inference</text>
<text x="38" y="84" font-size="16" fill="#536b7c" font-weight="400" text-anchor="start">Compute the head update offline; deploy one composed model.</text>
<rect x="32" y="112" width="356" height="440" rx="12" fill="#fff" stroke="#cedce5" />
<text x="52" y="149" font-size="19" fill="#536b7c" font-weight="400" text-anchor="start">01</text>
<text x="97" y="149" font-size="24" fill="#19334a" font-weight="700" text-anchor="start">Head training</text>
<rect x="422" y="112" width="356" height="440" rx="12" fill="#fff" stroke="#cedce5" />
<text x="442" y="149" font-size="19" fill="#536b7c" font-weight="400" text-anchor="start">02</text>
<text x="487" y="149" font-size="24" fill="#19334a" font-weight="700" text-anchor="start">Selective composition</text>
<rect x="812" y="112" width="356" height="440" rx="12" fill="#fff" stroke="#cedce5" />
<text x="832" y="149" font-size="19" fill="#536b7c" font-weight="400" text-anchor="start">03</text>
<text x="877" y="149" font-size="24" fill="#19334a" font-weight="700" text-anchor="start">Inference</text>
<rect x="52" y="177" width="316" height="103" rx="12" fill="#fff" stroke="#cedce5" />
<text x="72" y="211" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Ancestor</text>
<text x="72" y="244" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Aligned-replay model</text>
<text x="72" y="271" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Frozen Transformer backbone</text>
<path d="M210,280 L210,315" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="52" y="320" width="316" height="103" rx="12" fill="#eaf4fb" stroke="#cedce5" />
<text x="72" y="354" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Expert</text>
<text x="72" y="387" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">R0 replay · 10 training steps</text>
<text x="72" y="414" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Update lm_head only</text>
<text x="72" y="470" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">ΔW = Wexpert − Wancestor</text>
<text x="72" y="505" font-size="17" fill="#536b7c" font-weight="400" text-anchor="start">Minimize the training loss</text>
<rect x="442" y="177" width="316" height="103" rx="12" fill="#fff" stroke="#cedce5" />
<text x="462" y="211" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Target</text>
<text x="462" y="244" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Backbone of the final model</text>
<text x="462" y="271" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">EXP-174</text>
<path d="M600,280 L600,315" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="442" y="320" width="316" height="103" rx="12" fill="#fff5e5" stroke="#cedce5" />
<text x="462" y="354" font-size="22" fill="#bd862e" font-weight="700" text-anchor="start">SID a / b / c rows</text>
<text x="462" y="387" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Wtarget − 0.5 × ΔW</text>
<text x="462" y="414" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Copy other weights from Target</text>
<text x="462" y="470" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Compute the update in FP32</text>
<text x="462" y="505" font-size="17" fill="#536b7c" font-weight="400" text-anchor="start">Cast back to Target dtype</text>
<rect x="832" y="177" width="316" height="103" rx="12" fill="#fff" stroke="#cedce5" />
<text x="852" y="211" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Task input</text>
<text x="852" y="244" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Item descriptions / user history</text>
<text x="852" y="271" font-size="16.26" fill="#19334a" font-weight="400" text-anchor="start">Or user-understanding / QA prompts</text>
<path d="M990,280 L990,315" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="832" y="320" width="316" height="103" rx="12" fill="#e9f5f0" stroke="#cedce5" />
<text x="852" y="354" font-size="22" fill="#218575" font-weight="700" text-anchor="start">Composed OneReason</text>
<text x="852" y="387" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Autoregressive generation</text>
<text x="852" y="414" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">SID sequences or task text</text>
<text x="852" y="470" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Final model: EXP-182</text>
<text x="852" y="505" font-size="17" fill="#536b7c" font-weight="400" text-anchor="start">Best evaluation: EXP-201</text>
<path d="M388,355 L436,355" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<path d="M778,355 L826,355" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="32" y="572" width="1136" height="59" rx="12" fill="#eaf0f5" stroke="#cedce5" />
<text x="56" y="609" font-size="22" fill="#19334a" font-weight="400" text-anchor="start">R0 Item understanding     R1 User understanding     R2 Recommendation     R3 World knowledge</text>
</g></svg>
