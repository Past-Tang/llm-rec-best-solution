<text x="820" y="133" font-size="24" fill="#266fa5" font-weight="700" text-anchor="start">Target → Final</text>
<rect x="820" y="153" width="326" height="250" rx="12" fill="#fff" stroke="#cedce5" />
<rect x="832" y="165" width="302" height="65" rx="4" fill="#edf2f5" stroke="#cedce5" />
<text x="845" y="204" font-size="19" fill="#19334a" font-weight="400" text-anchor="start">Other vocabulary rows</text>
<rect x="832" y="238" width="302" height="42" rx="4" fill="#dcebf7" stroke="#cedce5" />
<text x="845" y="266" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">SID a</text>
<rect x="832" y="288" width="302" height="42" rx="4" fill="#e1f1e8" stroke="#cedce5" />
<text x="845" y="316" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">SID b</text>
<rect x="832" y="338" width="302" height="42" rx="4" fill="#fff0d6" stroke="#cedce5" />
<text x="845" y="366" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">SID c</text>
<text x="298" y="290" font-size="30" fill="#19334a" font-weight="400" text-anchor="middle">−</text>
<rect x="580" y="215" width="202" height="134" rx="12" fill="#fff5e5" stroke="#cedce5" />
<text x="600" y="249" font-size="22" fill="#bd862e" font-weight="700" text-anchor="start">ΔW</text>
<text x="600" y="282" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Expert − Ancestor</text>
<text x="600" y="309" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Select a / b / c rows</text>
<path d="M559,281 L574,281" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<path d="M785,281 L814,281" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<text x="936" y="438" font-size="22" fill="#bd862e" font-weight="700" text-anchor="middle">−0.5 × ΔW</text>
<text x="42" y="456" font-size="24" fill="#19334a" font-weight="700" text-anchor="start">Selected rows: Wfinal = Wtarget − 0.5 × (Wexpert − Wancestor)</text>
<rect x="42" y="485" width="535" height="124" rx="12" fill="#fff" stroke="#cedce5" />
<text x="62" y="519" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Numerical example</text>
<text x="62" y="552" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Target = 0.20, Expert − Ancestor = +0.04</text>
<text x="62" y="579" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Final = 0.20 − 0.5 × 0.04 = 0.18</text>
<rect x="600" y="485" width="548" height="124" rx="12" fill="#fff" stroke="#cedce5" />
<text x="620" y="519" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Where the update acts</text>
<text x="620" y="552" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">The head maps hidden states to token scores.</text>
<text x="620" y="579" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Copy the backbone and input embeddings from Target.</text>
<text x="42" y="654" font-size="21" fill="#19334a" font-weight="400" text-anchor="start">a: [151669, 159861)    b: [159861, 168053)    c: [168053, 176245)</text>
<text x="42" y="688" font-size="16" fill="#536b7c" font-weight="400" text-anchor="start">Illustrative values only. Later outputs depend on the input and previously generated tokens.</text>
</g></svg>
