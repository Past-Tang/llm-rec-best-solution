# Replay-preserving public-alignment candidate. The evaluation alias is a
# SID-disjoint deterministic split; val_size must stay zero for this contract.
model_name_or_path: /workspace/LLM-Rec/04_作战/rft_v2/output/onereason_0.8b_sft_v8t
trust_remote_code: true
flash_attn: fa2

stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 8
freeze_trainable_modules: all
freeze_extra_modules: lm_head
enable_liger_kernel: true

dataset: takeover_r0_aligned_replay_v1
eval_dataset: takeover_r0_aligned_replay_v1_eval
dataset_dir: /workspace/LLM-Rec/07_接管/experiments/dataset_registry_r0_aligned_replay
template: qwen3_nothink
cutoff_len: 32768
packing: true
neat_packing: true
overwrite_cache: false
preprocessing_num_workers: 16
